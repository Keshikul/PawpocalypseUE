[/Script/Engine.RendererSettings]
; Flat, unlit 2D game: nothing 3D the template turned on (docs/03 §7, docs/04). No Lumen, no ray tracing (designer, 2026-10-28).
; Unused RT/Substrate shaders caused E_OUTOFMEMORY PSO crashes in another project (KB U/12 §1.3).
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.RayTracing=False
r.RayTracing.RayTracingProxies.ProjectEnabled=False
r.Substrate=False
r.Nanite.ProjectEnabled=False
r.GenerateMeshDistanceFields=False
r.Shadow.Virtual.Enable=0
r.AllowStaticLighting=False
; Exposure must never move: flat colours have to match the Godot palette (docs/04 §3).
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Local exposure contrast 1.0 = no local tone change (engine default; the template had 0.8, which shifts flat colours).
r.DefaultFeature.LocalExposure.HighlightContrastScale=1.0
r.DefaultFeature.LocalExposure.ShadowContrastScale=1.0
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.LensFlare=False
r.SkinCache.CompileShaders=False
; FXAA (spike S1, 2026-10-28, docs/04 §10): the only method that smooths masked sprite outlines without ghosting movers.
; TSR/TAA smeared fast sprites (TSR also ~3x the GPU time); MSAA leaves masked outlines jagged (they are inside the quad).
r.AntiAliasingMethod=1
; Masked sprites clip their cut-out in the base pass too, not only in the depth pre-pass (engine default 1, read-only,
; compiled into the base pass). With 1, a masked quad's colour pass skips the clip and depth-tests EQUAL: an overlapping
; sprite layer at the same depth (or one rounded to it) painted its transparent texels (RGB 0) over another's pixels, a
; black silhouette (measured 2026-11-09, the R5 rig: the ant's and the hound's far legs; KB 2D/02 §4.6).
r.EarlyZPassOnlyMaterialMasking=False

