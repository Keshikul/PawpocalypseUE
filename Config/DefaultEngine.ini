; Render at the window's full resolution, always (spike S3, docs/04 §10). The desktop default, r.ScreenPercentage.Default.Desktop.Mode=
; BasedOnDisplayResolution, renders a 1080p window at 810p and 4K at 1080p and upscales: it blurred the sprite art far more than
; any AA method (sharpness 0.78 vs 0.95 at 100%). r.ScreenPercentage stays 0 so a later quality option can still override it.
[SystemSettings]
