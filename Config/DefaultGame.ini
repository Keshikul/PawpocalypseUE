[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=E8BB8A9A4E0261B7F1CED78CBC35B758
; 0.MINOR.PATCH (the designer, 2026-11-23: "Use minor type version numbers"); the title shows it ("v0.1.0").
; tools/package.py --bump raises the last number for a build that leaves the PC; MINOR is raised by hand.
ProjectVersion=0.1.0

[/Script/UnrealEd.ProjectPackagingSettings]
; Everything shipped lives under /Game/Pawpocalypse and is always cooked (docs/10 §1, KB U/19 §1).
+DirectoriesToAlwaysCook=(Path="/Game/Pawpocalypse")
; Maps are NOT cooked by the line above (UE 5.8.3, measured 2026-11-01: only GameDefaultMap was): list every map.
+MapsToCook=(FilePath="/Game/Pawpocalypse/Maps/L_Title")
+MapsToCook=(FilePath="/Game/Pawpocalypse/Maps/L_Realm")
; Every shipped language's ICU data (its culture, its line breaking: Thai's dictionary). The engine's default, English, stages
; English alone: a package then refuses zh-Hans, zh-Hant, pt-BR, pt-PT and es-419 (picked, the words stay in the language
; before) and never wraps Thai inside a sentence (measured 2026-11-23, tools/packaged_languages.py, HANDOFF-LOG (136)). No
; smaller preset has Russian, Polish or Thai. ~23 MB more on disk (ICU 64: 27 MB against 4.2).
InternationalizationPreset=All
; The string tables are loose CSVs (registered at startup, docs/08 §4): staged, or a packaged build has no text.
+DirectoriesToAlwaysStageAsUFS=(Path="Pawpocalypse/Localization")
; The paw cursors are loose PNGs the engine loads as hardware cursors (UGameViewportClient::SetHardwareCursor): staged.
+DirectoriesToAlwaysStageAsUFS=(Path="Pawpocalypse/UI/Cursors")
; Interchange and NNEDenoiser are editor-only (tools/trim_game_plugins.py), but engine config still references their
; content, and the cook fails on it ("imports class ... in a module that is not available on the platform"). Never cook it.
+DirectoriesToNeverCook=(Path="/Interchange")
+DirectoriesToNeverCook=(Path="/NNEDenoiser")

[/Script/CommonInput.CommonInputSettings]
; No InputData or controller data assets: Slate gets Godot's accept / back keys from FPawNavigationConfig and the glyphs are PawGlyphs (docs/05 §1, as built).
bEnableEnhancedInputSupport=True
